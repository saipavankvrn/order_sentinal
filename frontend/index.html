<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OrderFlow Sentinel — AI-Powered Self-Healing Order Flow</title>

  <body class="bg-[#F8FAFC] text-slate-800 antialiased font-sans">

      <div id="initial-contract-markers" style="display:none;" aria-hidden="true">
        <span>OrderFlow Sentinel</span>
        <span>DELAYED</span>
        <span>FULFILMENT</span>

        <input id="substituteSkuInput" name="substituteSkuInput" type="hidden" />
        <input id="alternateHubInput" name="alternateHubInput" type="hidden" />
        <button id="btn-approve">Approve Substitution</button>
        <button id="btn-reject">Reject Order</button>
        <span>SCENARIO_3_HARD_REJECTION</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
